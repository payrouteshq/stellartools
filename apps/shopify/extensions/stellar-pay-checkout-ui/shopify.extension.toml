api_version = "2025-10"

[[extensions]]
name = "Stellar Pay"
handle = "stellar-pay-checkout-ui"
type = "ui_extension"

[extensions.capabilities]
network_access = true

# Merchant sets this once in the checkout editor to your app URL (ngrok or prod)
[extensions.settings]
  [[extensions.settings.fields]]
  key = "app_url"
  name = "App Backend URL"
  description = "Your Shopify app backend URL (e.g. https://xxxx.ngrok-free.app)"
  required = true
  type = "single_line_text_field"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.payment-method-list.render-after"
